{% extends "base.html" %}

{% block conteudo %}
<div class="banner-container">
    <div id="carouselPromocoes" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        
        <!-- BOLINHAS (indicadores) -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselPromocoes" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselPromocoes" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselPromocoes" data-bs-slide-to="2"></button>
        </div>
        
        
        <!-- IMAGENS -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{{ url_for('static', filename='img/BannerPrincipal.png') }}" class="d-block w-100" alt="Supermercado Pedra Bonita">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='img/BannerEntrega.png') }}" class="d-block w-100" alt="Entrega em domicílio">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='img/BannerAgua.png') }}" class="d-block w-100" alt="Água">
            </div>
        </div>
        
        <!-- SETA ESQUERDA -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselPromocoes" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        
        <!-- SETA DIREITA -->
        <button class="carousel-control-next" type="button" data-bs-target="#carouselPromocoes" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
        
    </div>

    <!-- CATEGORIAS -->
<div class="categorias-container">
    <h2>Nossas Categorias</h2>
    
    <div class="categorias-grid">
        <!-- ALIMENTOS -->
        <a href="{{ url_for('produtos') }}" class="categoria-card">
            <img src="{{ url_for('static', filename='img/categoria-alimentos.png') }}" 
                 alt="Alimentos">
            <p>Alimentos</p>
        </a>
        
        <!-- BEBIDAS -->
        <a href="{{ url_for('produtos') }}" class="categoria-card">
            <img src="{{ url_for('static', filename='img/categoria-bebidas.png') }}" 
                 alt="Bebidas">
            <p>Bebidas</p>
        </a>
        
        <!-- LIMPEZA -->
        <a href="{{ url_for('produtos') }}" class="categoria-card">
            <img src="{{ url_for('static', filename='img/categoria-limpeza.png') }}" 
                 alt="Limpeza">
            <p>Limpeza</p>
        </a>
        
        <!-- HORTIFRUTI -->
        <a href="{{ url_for('produtos') }}" class="categoria-card">
            <img src="{{ url_for('static', filename='img/categoria-hortifruti.png') }}" 
                 alt="Hortifruti">
            <p>Hortifruti</p>
        </a>
    </div>
</div>

<div class="destaque-container">
    <h2>Produtos em Destaque</h2>
    
<div class="destaque-grid">
    {% for produto in produtos %}
    <div class="produto-card">
        <!-- IMAGEM -->
        <img src="{{ url_for('static', filename=produto.imagem_url) }}" 
             alt="{{ produto.nome }}" 
             class="produto-img">
        
        <!-- NOME -->
        <h3>{{ produto.nome }}</h3>
        
        <!-- PREÇO -->
        <p class="preco">R$ {{ "%.2f"|format(produto.preco) }}</p>
        
        <!-- BOTÃO -->
        <a href="{{ url_for('adicionar_carrinho', produto_id=produto.id) }}" class="btn-comprar">
    Comprar
</a>
    </div>
    {% endfor %}
</div>
</div>
    </div>

</div>
</div>
{% endblock %}
